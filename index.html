<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mission Timer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0d10">
<title>Mission Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  :root{
    --bg: #0a0d10;
    --panel: #12171c;
    --panel-raised: #171d23;
    --line: #262f37;
    --amber: #ffb000;
    --amber-dim: #7a5800;
    --green: #2de08e;
    --green-dim: #0f5c3c;
    --text: #e6ecf0;
    --text-dim: #7c8894;
    --red: #ff4d4d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height:100vh;
  }
  .mono{
    font-family: 'SF Mono', 'Roboto Mono', ui-monospace, 'Courier New', monospace;
    font-variant-numeric: tabular-nums;
  }
  .wrap{
    max-width: 480px; margin: 0 auto; padding: 18px 16px 40px;
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 6px 2px 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  header h1{
    font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 700; color: var(--text); margin:0;
  }
  header .reg{
    font-size: 13px; color: var(--amber); font-weight:600;
    background: none; border: none; text-align:right;
    border-bottom: 1px dashed var(--amber-dim);
    padding: 2px 0; width: 90px;
  }
  header .reg:focus{ outline:none; border-bottom-color: var(--amber); }
  header .reg::placeholder{ color: #4a3a1a; font-style: italic; font-weight:400; }
  header .header-right{
    display:flex; flex-direction:column; align-items:flex-end; gap:4px;
  }
  header .header-left{ display:flex; align-items:baseline; gap:8px; }
  header .app-version{
    font-size: 11px; color: #4a5560; letter-spacing: 0.06em; font-weight:600;
  }
  .route-clock-row{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 22px;
  }
  .route{
    font-size: 13px; color: var(--text); font-weight:600;
    background: none; border: none; text-align:left;
    border-bottom: 1px dashed #3a4048;
    padding: 4px 0; width: 150px; letter-spacing: 0.05em;
  }
  .route::placeholder{ color: #3a4048; font-style: italic; font-weight:400; }
  .route:focus{ outline:none; border-bottom-color: var(--text-dim); }

  .clock{
    text-align:right; color: var(--text-dim); font-size: 13px;
    letter-spacing: 0.05em;
  }
  .clock span{ color: var(--text-dim); font-size: 15px; }

  .flight-timer{
    text-align:center; margin-bottom: 22px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .flight-timer.running{ border-color: var(--amber-dim); background: linear-gradient(180deg, #221a0c, #171310); }
  .flight-timer .label{
    font-size: 11px; letter-spacing:0.1em; text-transform:uppercase; color: var(--text-dim); margin-bottom: 6px;
  }
  .flight-timer .value{ font-size: 30px; font-weight:700; color: #3a444d; letter-spacing:0.02em; }
  .flight-timer.running .value{ color: var(--amber); }

  .step{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: border-color .15s ease, background .15s ease, opacity .15s ease;
  }
  .step-main{
    display:flex; align-items:center; justify-content:space-between; gap: 8px;
  }
  .step.done{
    border-color: var(--line);
    background: var(--panel);
  }
  /* Anything that is not what you should be doing right now fades back, so the
     live block is the obvious one: already captured, or not reachable yet.
     Faded blocks stay fully usable - tapping into one restores it to full
     strength so a value can be read or corrected. */
  .dimmed{ opacity: 0.5; }
  .dimmed:focus-within{ opacity: 1; }

  /* Start shrinks out of the way once captured - it is history for the rest of
     the leg. The time stays editable so it can still be corrected. */
  .step.collapsed{ padding: 7px 16px; }
  .step.collapsed button.capture{ display:none; }
  .step.collapsed .time-display{ font-size: 16px; min-width: 54px; }
  .step.collapsed .step-label .name{ font-size: 11px; }
  .step.collapsed input.fuel-input{ font-size: 13px; padding: 5px 8px; max-width: 72px; }

  /* A carried Start (the engine kept running from the previous leg, so this
     leg has no start of its own) isn't shown collapsed-with-a-value - that
     still looked like something had been captured on this leg. Hide it
     outright instead. It reappears once a leg finally records a shutdown,
     starting the next leg's Start fresh. The carried value still exists
     internally (current.off_blocks) for the Start-Shutdown timer, ground
     time and Fuel Used - only the on-screen block disappears. */
  .step.carried{ display:none; }

  /* Mission collapses once it is no longer live for this leg (post-Land and
     not running), same idea as Start/Shutdown but smaller chrome throughout
     rather than hiding a single button - Start/End and the hoist counter stay
     fully working, since the mission timer can still be started again. */
  .timer-card.collapsed{ padding: 10px 14px; }
  .timer-card.collapsed .timer-top{ margin-bottom: 2px; }
  .timer-card.collapsed .timer-big{ font-size: 16px; margin: 0 0 4px; }
  .timer-card.collapsed .hoist-btn{ width: 24px; height: 24px; font-size: 15px; }
  .timer-card.collapsed .hoist-value{ font-size: 16px; min-width: 18px; }
  .timer-card.collapsed .fuel-row{ margin-top: 6px; padding-top: 6px; }
  .timer-card.collapsed .fuel-row input.fuel-input{ font-size: 13px; padding: 6px 8px; }
  .timer-card.collapsed button.btn-timer{ padding: 8px 0 !important; font-size: 12px !important; }
  /* The start/end time range is empty chrome until a segment exists, and the
     End row (fuel + button) is meaningless before Start has been pressed -
     both only earn their space once the mission timer is actually running,
     at which point the card is no longer .collapsed and they reappear. */
  .timer-card.collapsed .timer-sub{ display:none; }
  .timer-card.collapsed .mission-end-row{ display:none; }
  .step-label{
    display:flex; flex-direction:column; gap:3px; flex: 0 0 auto;
  }
  .step-label .name{
    font-size: 13px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--text-dim); font-weight:700;
  }
  /* "Shutdown" is the longest step name and needs to be smaller to fit on one
     line with the fuel box, time and Capture button at 375px. */
  #step-on_blocks .step-label .name{ font-size: 11px; letter-spacing:0.03em; }
  .step.done .step-label .name{ color: var(--text-dim); }

  .fuel-row{
    display:flex; align-items:center; justify-content:flex-end; gap:8px;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
  }
  .fuel-row label{
    font-size: 11px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-dim);
  }
  input.fuel-input{
    -webkit-appearance:none; appearance:none;
    background: var(--panel-raised); border: 1px solid #33404a; color: var(--text);
    font-size: 15px; font-weight:600; text-align:right;
    padding: 8px 10px; border-radius: 8px; width: 84px;
    font-family: 'SF Mono', 'Roboto Mono', ui-monospace, 'Courier New', monospace;
  }
  input.fuel-input:focus{ outline:none; border-color: var(--amber); }
  input.fuel-input::placeholder{ color: #4a5560; }
  /* One-line step rows (name | fuel | time | Capture): the fuel box is the only
     flexible item, so it soaks up whatever width the row has spare. */
  .step-main input.fuel-input{
    font-size: 14px; padding: 8px;
    flex: 1 1 auto; width: auto; min-width: 56px; max-width: 84px;
  }
  input.mission-time-inline{
    -webkit-appearance:none; appearance:none; background:transparent; border:none;
    font: inherit; color: inherit; padding:0; width:auto; color-scheme: dark;
  }
  input.mission-time-inline:focus{ outline:none; }

  .time-display{
    font-size: 22px; font-weight:600; color: #3a444d; min-width: 78px; text-align:right;
    flex: 0 0 auto;
  }
  /* Give the Shutdown row's time a little room to shrink too, on top of the
     smaller label above, so nothing overflows at 375px. */
  #step-on_blocks .time-display{ flex: 0 1 auto; min-width: 66px; }
  .step.done .time-display{ color: var(--text); }
  input.time-display{
    -webkit-appearance:none; appearance:none; background:transparent; border:none;
    font: inherit; color: inherit; padding:0; color-scheme: dark;
  }
  input.time-display:focus{ outline:none; }

  button.capture{
    -webkit-appearance:none; appearance:none; border:none; cursor:pointer;
    background: var(--panel-raised);
    border: 1px solid #33404a;
    color: var(--amber);
    font-size: 12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    padding: 14px 10px; border-radius: 12px;
    min-width: 80px; flex: 0 0 auto;
    transition: transform .08s ease, background .12s ease;
  }
  button.capture:active{ transform: scale(0.96); background:#1e262e; }
  /* Start carried over from a leg that was never shut down - nothing to capture. */
  button.capture:disabled{ cursor: default; }
  button.capture:disabled:active{ transform: none; }
  .step.done button.capture{
    background: var(--panel-raised); color: var(--text-dim); border-color: #2a343d;
  }

  .section-label{
    font-size: 12px; letter-spacing:0.12em; text-transform:uppercase; color: var(--text-dim);
    margin: 22px 2px 10px; font-weight:700;
  }

  .timer-card{
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px;
    transition: opacity .15s ease;
  }
  .timer-card.running{ border-color: var(--amber-dim); background: linear-gradient(180deg, #221a0c, #171310); }
  .timer-top{ display:flex; justify-content:space-between; align-items:stretch; margin-bottom:10px; }
  .hoist-block{ text-align:right; display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .hoist-label{
    font-size: 11px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-dim);
    font-weight:700; margin-bottom: 8px;
  }
  .hoist-counter{ display:flex; align-items:center; gap:10px; justify-content:flex-end; }
  .hoist-value{ font-size: 22px; font-weight:700; color: var(--text); min-width: 24px; text-align:center; }
  .hoist-btn{
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid #33404a;
    background: var(--panel-raised); color: var(--amber); font-size: 18px; font-weight:700;
    line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .hoist-btn:active{ background: var(--amber); color:#241900; }
  .timer-name{ font-size: 13px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-dim); font-weight:700; }
  .timer-card.running .timer-name{ color: var(--amber); }
  .timer-sub{ font-size: 11px; color: #56616c; margin-top:2px; }
  .timer-big{
    font-size: 34px; font-weight:700; color: #3a444d; letter-spacing: 0.02em; margin: 4px 0 12px;
  }
  .timer-card.running .timer-big{ color: var(--amber); }
  button.btn-timer{
    -webkit-appearance:none; appearance:none; border:none; cursor:pointer; width:100%;
    background: var(--panel-raised); border: 1px solid #33404a; color: var(--text);
    font-size: 13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    padding: 13px; border-radius: 12px; transition: transform .08s ease, background .12s ease;
  }
  button.btn-timer:active{ transform: scale(0.97); }
  button.btn-timer.active{ background: var(--amber); color: #241900; border-color: var(--amber); }
  button.btn-timer:disabled{ opacity: 0.35; cursor: not-allowed; }

  .summary{
    margin-top: 18px; padding: 16px 18px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
  }
  .summary-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .label{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); }
  .summary-row .value{ font-size: 20px; font-weight:700; color: var(--amber); }

  .actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; -webkit-appearance:none; appearance:none; border:none; cursor:pointer;
    padding: 15px; border-radius: 12px; font-size: 14px; font-weight:700;
    letter-spacing:0.05em; text-transform:uppercase;
  }
  .btn-save{ background: var(--green); color:#04201430; color:#052014; }
  .btn-reset{ background: transparent; color: var(--text-dim); border: 1px solid var(--line); }
  .btn:active{ transform: scale(0.97); }

  .history{ margin-top: 28px; }
  .history h2{
    font-size: 12px; letter-spacing:0.12em; text-transform:uppercase; color: var(--text-dim);
    margin: 0 0 10px 2px; display:flex; justify-content:space-between; align-items:center;
  }
  .history h2 button{
    background:none; border:none; color: var(--red); font-size:11px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; padding:4px;
  }
  .leg-card{
    background: var(--panel); border:1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; font-size: 13px;
    cursor: pointer; transition: border-color .12s ease, background .12s ease;
  }
  .leg-card:active{ background: var(--panel-raised); }
  /* The leg currently loaded into the fields above. */
  .leg-card.editing{ border-color: var(--amber); background: linear-gradient(180deg, #221a0c, #171310); }
  .leg-card .row1{ display:flex; justify-content:space-between; color: var(--text-dim); margin-bottom:6px; }
  .leg-card .row2{ display:flex; justify-content:space-between; }
  .leg-card .times{ color: var(--text); }
  .leg-card .durations{ color: var(--amber); font-weight:600; }
  .empty{ color: var(--text-dim); font-size: 13px; text-align:center; padding: 20px 0; }

  .toast{
    position:fixed; bottom: 24px; left:50%; transform:translateX(-50%);
    background: var(--green); color:#052014; font-weight:700; font-size:13px;
    padding: 10px 18px; border-radius: 20px; opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(5,7,9,0.6);
    display:flex; align-items:center; justify-content:center;
    padding: 24px; z-index: 10000;
    opacity:0; pointer-events:none; transition: opacity .15s ease;
  }
  .confirm-overlay.show{ opacity:1; pointer-events:auto; }
  .confirm-sheet{
    background: var(--panel-raised); border:1px solid var(--line); border-radius: 14px;
    padding: 20px; max-width: 320px; width:100%; text-align:center;
  }
  .confirm-sheet p{ margin: 0 0 18px; font-size:15px; color: var(--text); }
  .confirm-sheet .row{ display:flex; gap:10px; }
  .confirm-sheet button{
    flex:1; padding:12px; border-radius:10px; border:1px solid #33404a;
    font-size:14px; font-weight:700; background: var(--panel); color: var(--text);
  }
  .confirm-sheet button.confirm-yes{ background: var(--amber); color:#241900; border-color: var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <h1>Mission Timer</h1>
      <span class="app-version mono" id="appVersion"></span>
    </div>
    <div class="header-right">
      <input class="reg mono" id="regInput" placeholder="Reg" maxlength="10">
    </div>
  </header>

  <div class="route-clock-row">
    <input class="route mono" id="routeInput" placeholder="Route" maxlength="40">
    <div class="clock mono">Now &nbsp; <span id="liveClock">--:--:--</span></div>
  </div>

  <div class="flight-timer" id="liftLandTimer">
    <div class="label">Lift → Land</div>
    <div class="value mono" id="liftLandValue">00:00:00</div>
  </div>

  <div class="step" id="step-off_blocks" data-key="off_blocks">
    <div class="step-main">
      <div class="step-label">
        <div class="name">Start</div>
      </div>
      <input class="fuel-input mono" id="fuel-off_blocks" data-fuel="off_blocks" type="text" inputmode="decimal" placeholder="kg" aria-label="Start fuel">
      <input type="time" class="time-display mono" id="disp-off_blocks" data-key="off_blocks">
      <button class="capture" data-key="off_blocks">Capture</button>
    </div>
  </div>

  <div class="step" id="step-airborne" data-key="airborne">
    <div class="step-main">
      <div class="step-label">
        <div class="name">Lift</div>
      </div>
      <input class="fuel-input mono" id="fuel-airborne" data-fuel="airborne" type="text" inputmode="decimal" placeholder="kg" aria-label="Lift fuel">
      <input type="time" class="time-display mono" id="disp-airborne" data-key="airborne">
      <button class="capture" data-key="airborne">Capture</button>
    </div>
  </div>

  <div class="timer-card" id="timer-mission">
    <div class="timer-top" style="align-items:baseline; margin-bottom:2px;">
      <div class="timer-name">Mission</div>
      <div class="hoist-label">Hoists/Slings</div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div>
        <div class="timer-sub" id="sub-mission">
          <input type="time" class="mission-time-inline mono" id="mission-start-time"> → <input type="time" class="mission-time-inline mono" id="mission-end-time">
        </div>
        <div class="timer-big mono" id="big-mission">00:00:00</div>
      </div>
      <div class="hoist-counter">
        <button type="button" class="hoist-btn" id="hoistMinus">−</button>
        <span class="hoist-value mono" id="hoistCount">0</span>
        <button type="button" class="hoist-btn" id="hoistPlus">+</button>
      </div>
    </div>
    <div class="fuel-row" style="justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:10px;">
        <label for="fuel-mission_start" style="width:34px;">Fuel</label>
        <input class="fuel-input mono" id="fuel-mission_start" data-fuel="mission_start" type="text" inputmode="decimal" placeholder="kg">
      </div>
      <button class="btn-timer" id="start-mission" data-timer="mission" style="width:100px; padding:12px 0; font-size:14px;">Start</button>
    </div>
    <div class="fuel-row mission-end-row" style="justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:10px;">
        <label for="fuel-mission_end" style="width:34px;">Fuel</label>
        <input class="fuel-input mono" id="fuel-mission_end" data-fuel="mission_end" type="text" inputmode="decimal" placeholder="kg">
      </div>
      <button class="btn-timer" id="end-mission" data-timer="mission" style="width:100px; padding:12px 0; font-size:14px;">End</button>
    </div>
  </div>

  <div class="step" id="step-landed" data-key="landed">
    <div class="step-main">
      <div class="step-label">
        <div class="name">Land</div>
      </div>
      <input class="fuel-input mono" id="fuel-landed" data-fuel="landed" type="text" inputmode="decimal" placeholder="kg" aria-label="Land fuel">
      <input type="time" class="time-display mono" id="disp-landed" data-key="landed">
      <button class="capture" data-key="landed">Capture</button>
    </div>
  </div>

  <div class="step" id="step-on_blocks" data-key="on_blocks">
    <div class="step-main">
      <div class="step-label">
        <div class="name">Shutdown</div>
      </div>
      <input class="fuel-input mono" id="fuel-on_blocks" data-fuel="on_blocks" type="text" inputmode="decimal" placeholder="kg" aria-label="Shutdown fuel">
      <input type="time" class="time-display mono" id="disp-on_blocks" data-key="on_blocks">
      <button class="capture" data-key="on_blocks">Capture</button>
    </div>
  </div>

  <div class="flight-timer" id="startStopTimer">
    <div class="label">Start → Shutdown</div>
    <div class="value mono" id="startStopValue">00:00:00</div>
  </div>

  <div class="actions">
    <button class="btn btn-reset" id="resetBtn">Reset Leg</button>
    <button class="btn btn-save" id="saveBtn">Save Leg</button>
  </div>

  <div class="history">
    <h2>Saved Legs <span><button id="exportHistory" style="color:var(--green); margin-right:10px;">Export</button><button id="clearHistory">Clear all</button></span></h2>
    <div id="historyList"><div class="empty">No legs saved yet</div></div>
  </div>

  <div class="summary" id="totalFuelCard" style="margin-top:14px; display:none;">
    <div class="summary-row" id="rowFlyingTime">
      <div class="label">Total Flying Time</div>
      <div class="value mono" id="totalFlyingTime">—</div>
    </div>
    <div class="summary-row" id="rowBladesTurning">
      <div class="label">Total Blades Turning</div>
      <div class="value mono" id="totalBladesTurning">—</div>
    </div>
    <div class="summary-row" id="rowGroundTime">
      <div class="label">Total Ground Time</div>
      <div class="value mono" id="totalGroundTime">—</div>
    </div>
    <div class="summary-row" id="rowFuelUsed">
      <div class="label">Total Fuel Used</div>
      <div class="value mono" id="totalFuelUsed">—</div>
    </div>
    <div class="summary-row" id="rowFuelUploaded">
      <div class="label">Total Fuel Uploaded</div>
      <div class="value mono" id="totalFuelUploaded">—</div>
    </div>
  </div>

  <div class="section-label" id="notifToggle" style="cursor:pointer;">Notifications ▸</div>
  <div class="timer-card" id="notifPanel" style="display:none;">
    <div class="fuel-row">
      <label for="workerUrl">Relay URL</label>
      <input class="fuel-input mono" id="workerUrl" type="text" placeholder="https://...workers.dev">
    </div>
    <div class="actions" style="margin-top:14px;">
      <button class="btn-timer" id="tgSaveBtn" style="flex:1; width:auto;">Save</button>
      <button class="btn-timer" id="tgTestBtn" style="flex:1; width:auto;">Send Test</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Leg saved</div>

<div id="doneBar" style="display:none; position:fixed; left:0; right:0; bottom:0; z-index:9999; background:#1c2126; border-top:1px solid #2a2f36; padding:10px 14px; justify-content:flex-end;">
  <button id="doneBarBtn" style="background:var(--amber); color:#241900; font-weight:700; font-size:16px; border:none; border-radius:10px; padding:10px 22px;">Done</button>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-sheet">
    <p id="confirmMessage"></p>
    <div class="row">
      <button id="confirmNo">No</button>
      <button class="confirm-yes" id="confirmYes">Yes</button>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY = 'flight-timer:legs';
const REG_KEY = 'flight-timer:reg';
const WORKER_URL_KEY = 'flight-timer:worker_url';
// Shown in the header so you can tell at a glance which build the phone is
// running. Keep this in step with CACHE_NAME in sw.js - bump both together.
const APP_VERSION = 'v57';
document.getElementById('appVersion').textContent = APP_VERSION;

const STEP_LABELS = { off_blocks: 'Start', airborne: 'Lift', landed: 'Land', on_blocks: 'Shutdown' };

// Fuel readings, listed in the order they happen during a leg.
const FUEL_ORDER = ['off_blocks','airborne','mission_start','mission_end','landed','on_blocks'];
const FUEL_LABELS = {
  off_blocks: 'Start', airborne: 'Lift',
  mission_start: 'Mission Start', mission_end: 'Mission End',
  landed: 'Land', on_blocks: 'Shutdown'
};
// Legs saved before Lift/Land fuel existed simply lack those keys, so they are skipped.
function fuelPartsFor(f){
  if (!f) return [];
  return FUEL_ORDER
    .filter(k => f[k] !== '' && f[k] !== undefined && f[k] !== null)
    .map(k => `${FUEL_LABELS[k]}: ${f[k]}kg`);
}

async function sendTelegram(text){
  let url;
  try{
    url = localStorage.getItem(WORKER_URL_KEY);
  }catch(e){ return; }
  if (!url) return;
  try{
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
  }catch(e){
    // Silent fail - never interrupt the actual logging flow over a network hiccup.
  }
}

function buildTelegramMessage(line){
  const reg = document.getElementById('regInput').value || 'Aircraft';
  const route = document.getElementById('routeInput').value;
  const header = route ? `${reg} - ${route}` : reg;
  return `${header}\n${line}`;
}
const keys = ['off_blocks','airborne','landed','on_blocks'];
let current = {};
let fuel = {};
let hoistCount = 0;

// Toggle timer for mission (can be started/stopped, tracks segments)
let timers = {
  mission: { segments: [], running: false, currentStart: null }
};

function fmtHMS(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');
}
function timerTotalMs(t, now){
  let ms = t.segments.reduce((sum,seg)=> sum + (seg.end - seg.start), 0);
  if (t.running && t.currentStart) ms += (now - t.currentStart);
  return ms;
}
function startTimer(name){
  const t = timers[name];
  if (t.running) return;
  if (name === 'mission') missionTouched = true;
  t.running = true;
  t.currentStart = new Date();
  renderTimer(name);
  updateFocus();
  if (name === 'mission'){
    let msg = `Mission Start - ${toHHMM(t.currentStart)}`;
    if (fuel['mission_start']) msg += ` - Fuel ${fuel['mission_start']}kg`;
    sendTelegram(buildTelegramMessage(msg));
  }
}
function endTimer(name){
  const t = timers[name];
  if (!t.running) return;
  if (name === 'mission') missionTouched = true;
  const end = new Date();
  t.segments.push({ start: t.currentStart, end: end });
  t.running = false;
  t.currentStart = null;
  renderTimer(name);
  updateFocus();
  if (name === 'mission'){
    const totalMs = t.segments.reduce((sum,seg)=> sum + (seg.end - seg.start), 0);
    const durMins = Math.round(totalMs / 60000);
    let msg = `Mission End - ${toHHMM(end)} (Duration: ${fmtDuration(durMins)})`;
    if (fuel['mission_end']) msg += ` - Fuel ${fuel['mission_end']}kg`;
    if (hoistCount) msg += ` - Hoists/Slings ${hoistCount}`;
    sendTelegram(buildTelegramMessage(msg));
  }
}
function setMissionStart(newDate){
  missionTouched = true;
  const t = timers.mission;
  if (t.running){
    t.currentStart = newDate;
  } else if (t.segments.length){
    t.segments[0].start = newDate;
  } else {
    t.running = true;
    t.currentStart = newDate;
  }
  renderTimer('mission');
  tickTimers();
}
function setMissionEnd(newDate){
  missionTouched = true;
  const t = timers.mission;
  if (t.running){
    t.segments.push({ start: t.currentStart, end: newDate });
    t.running = false;
    t.currentStart = null;
  } else if (t.segments.length){
    t.segments[t.segments.length-1].end = newDate;
  } else {
    t.segments.push({ start: newDate, end: newDate });
  }
  renderTimer('mission');
  tickTimers();
}
function renderTimer(name){
  const t = timers[name];
  const card = document.getElementById('timer-'+name);
  const startBtn = document.getElementById('start-'+name);
  const endBtn = document.getElementById('end-'+name);
  const sub = document.getElementById('sub-'+name);
  card.classList.toggle('running', t.running);
  startBtn.disabled = t.running;
  endBtn.disabled = !t.running;
  startBtn.classList.toggle('active', false);
  endBtn.classList.toggle('active', t.running);
  if (name === 'mission'){
    const startInput = document.getElementById('mission-start-time');
    const endInput = document.getElementById('mission-end-time');
    const startVal = t.currentStart || (t.segments.length ? t.segments[0].start : null);
    startInput.value = startVal ? toHHMM(startVal) : '';
    const endVal = (!t.running && t.segments.length) ? t.segments[t.segments.length-1].end : null;
    endInput.value = endVal ? toHHMM(endVal) : '';
  } else if (t.running){
    sub.textContent = 'Started ' + fmtTime(t.currentStart);
  } else if (t.segments.length){
    const last = t.segments[t.segments.length-1];
    sub.textContent = fmtTime(t.segments[0].start) + ' → ' + fmtTime(last.end);
  } else {
    sub.textContent = 'Not started';
  }
}
function tickTimers(){
  const now = new Date();
  const t = timers.mission;
  document.getElementById('big-mission').textContent = fmtHMS(timerTotalMs(t, now));
}
function resetTimers(){
  timers = {
    mission: { segments: [], running: false, currentStart: null }
  };
  renderTimer('mission');
  tickTimers();
}

function fmtTime(d){
  return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', hour12:false});
}
function toHHMM(d){
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtClock(d){
  return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
}
function diffMinutes(a,b){
  return Math.round((b-a)/60000);
}
function fmtDuration(mins){
  if (mins < 0) mins += 24*60;
  const h = Math.floor(mins/60), m = mins%60;
  return h + 'h ' + String(m).padStart(2,'0') + 'm';
}

// Legs belonging to the still-open engine run: everything saved after the
// most recent leg that recorded a Shutdown. Once a leg shuts down, that
// closes its run - a fresh Start afterwards begins a new one, so the
// on-screen timers (unlike the Totals summary, which stays cumulative across
// all history) should only reflect the current run.
function currentRunLegs(legs){
  let start = 0;
  for (let i = legs.length - 1; i >= 0; i--){
    if (legs[i].on_blocks){ start = i + 1; break; }
  }
  return legs.slice(start);
}

// Total time between startKey and endKey across the current engine run only,
// plus the leg in progress if its startKey is captured but its endKey is not
// yet - so the figure keeps running live rather than jumping only when a leg
// is saved. Resets to zero both on Clear all and the instant a fresh,
// non-carried Start begins after a Shutdown. Naturally excludes any leg whose
// endKey never happened (a carried-over start, still open on a later leg)
// since that leg alone has no endKey either - the whole span it belongs to is
// only ever counted once, on whichever leg finally captures the end.
function totalMsBetween(startKey, endKey){
  const legs = currentRunLegs(loadHistory());
  let ms = legs.reduce((sum, leg)=>{
    if (leg[startKey] && leg[endKey]) return sum + (new Date(leg[endKey]) - new Date(leg[startKey]));
    return sum;
  }, 0);
  if (current[startKey] && !current[endKey]) ms += (new Date() - current[startKey]);
  return ms;
}

function updateLiftLandTimer(){
  const card = document.getElementById('liftLandTimer');
  const val = document.getElementById('liftLandValue');
  card.classList.toggle('running', !!(current.airborne && !current.landed));
  val.textContent = fmtHMS(totalMsBetween('airborne', 'landed'));
}

// Total time the blades have been turning: Start to Shutdown, summed across
// every leg since the history was last cleared.
function updateStartStopTimer(){
  const card = document.getElementById('startStopTimer');
  const val = document.getElementById('startStopValue');
  card.classList.toggle('running', !!(current.off_blocks && !current.on_blocks));
  val.textContent = fmtHMS(totalMsBetween('off_blocks', 'on_blocks'));
}

function tickClock(){
  document.getElementById('liveClock').textContent = fmtClock(new Date());
  tickTimers();
  updateLiftLandTimer();
  updateStartStopTimer();
}
setInterval(tickClock, 1000);
tickClock();

function updateSummary(){
  // Block Time / Fuel Used / Mission Fuel Used summary card removed.
}

function fuelUsedBetween(f, startKey, endKey){
  if (!f) return null;
  const start = parseFloat(f[startKey]);
  const end = parseFloat(f[endKey]);
  if (isNaN(start) || isNaN(end)) return null;
  return start - end;
}
function fuelUsedFor(f){
  return fuelUsedBetween(f, 'off_blocks', 'on_blocks');
}

// Fuel on board at the end of a leg. Land is the reading meant for this, but
// the pairing rule hides that box when a Shutdown reading was taken instead,
// so fall back to it.
function legEndFuel(leg){
  const f = leg.fuel || {};
  const land = parseFloat(f.landed);
  if (!isNaN(land)) return land;
  const shutdown = parseFloat(f.on_blocks);
  return isNaN(shutdown) ? null : shutdown;
}
// Fuel on board at the start of a leg, same idea in reverse. A *carried* Start
// is copied from the previous leg's engine start and is stale by definition,
// so it is never used here - a hot-load leg has its own Lift reading instead.
function legStartFuel(leg){
  const f = leg.fuel || {};
  if (!leg.startCarried){
    const start = parseFloat(f.off_blocks);
    if (!isNaN(start)) return start;
  }
  const lift = parseFloat(f.airborne);
  return isNaN(lift) ? null : lift;
}
// Fuel put in between two legs: more on board at the start of this one than
// there was at the end of the last. Computed at render time rather than stored,
// so legs saved before this existed get it too.
function uploadedBetween(prevLeg, leg){
  if (!prevLeg || !leg) return null;
  const before = legEndFuel(prevLeg);
  const after = legStartFuel(leg);
  if (before === null || after === null) return null;
  const diff = after - before;
  return diff > 0 ? diff : null;
}

// Only one part of a leg is live at a time. Everything else fades back, whether
// it is already captured or not reachable yet:
//   nothing captured -> Start
//   Start captured   -> Lift, Mission, Land   (Shutdown is not offered until landed)
//   Land captured    -> Shutdown
//   Shutdown captured -> nothing, the leg is ready to save
const BLOCK_ELS = {
  off_blocks: 'step-off_blocks', airborne: 'step-airborne', mission: 'timer-mission',
  landed: 'step-landed', on_blocks: 'step-on_blocks'
};
const REACHABLE = {
  preStart: ['off_blocks'],
  airborne: ['airborne','mission','landed'],
  postLand: ['on_blocks'],
  complete: []
};
function legStage(){
  if (!current.off_blocks) return 'preStart';
  if (!current.landed)     return 'airborne';
  if (!current.on_blocks)  return 'postLand';
  return 'complete';
}
// Start and Lift are minutes apart, as are Land and Shutdown, so one fuel
// reading covers each pair. Start and Shutdown are the ones that matter - Fuel
// Used is Start minus Shutdown - so a value there drops the partner box. Only
// ever hidden while the partner is empty, so a reading already taken is never
// lost.
const FUEL_PARTNER = { airborne: 'off_blocks', landed: 'on_blocks' };
function updateFuelVisibility(){
  // On a hot load Start fuel is carried from the previous leg's shutdown, not
  // a reading taken now - Lift still needs its own, so don't hide it.
  const startIsCarried = document.getElementById('step-off_blocks').classList.contains('carried');
  Object.keys(FUEL_PARTNER).forEach(key=>{
    if (key === 'airborne' && startIsCarried){
      document.getElementById('fuel-airborne').style.display = '';
      return;
    }
    const primary = (fuel[FUEL_PARTNER[key]] || '').trim();
    const own = (fuel[key] || '').trim();
    document.getElementById('fuel-'+key).style.display = (primary && !own) ? 'none' : '';
  });
}

function updateFocus(){
  const reachable = REACHABLE[legStage()];
  // Start and Shutdown are history once captured - collapse them and give the
  // space back. The time (and, for Start, the fuel) stays editable.
  document.getElementById('step-off_blocks').classList.toggle('collapsed', !!current.off_blocks);
  document.getElementById('step-on_blocks').classList.toggle('collapsed', !!current.on_blocks);
  updateFuelVisibility();
  Object.keys(BLOCK_ELS).forEach(key=>{
    const el = document.getElementById(BLOCK_ELS[key]);
    if (!el) return;
    let dim;
    if (key === 'mission'){
      // The mission card has no capture time of its own, and has to stay full
      // size and visible whenever its timer is actually running - it might be
      // started again later in the same leg.
      dim = timers.mission.running ? false : !reachable.includes(key);
      // Collapse is deliberately its own condition, not tied to dim: sitting
      // idle-but-reachable between Lift and Land (in flight, hoists not yet
      // started) is exactly the "not using it right now" case that should
      // shrink, even though it stays undimmed and legible while reachable.
      el.classList.toggle('collapsed', !timers.mission.running);
    } else {
      dim = !!current[key] || !reachable.includes(key);
    }
    el.classList.toggle('dimmed', dim);
  });
}

function capture(key){
  const now = new Date();
  now.setSeconds(0, 0);
  current[key] = now;
  document.getElementById('disp-'+key).value = toHHMM(current[key]);
  document.getElementById('step-'+key).classList.add('done');
  updateSummary();
  updateLiftLandTimer();
  updateStartStopTimer();
  updateFocus();
  let msg = `${STEP_LABELS[key] || key} - ${toHHMM(current[key])}`;
  if (fuel[key]) msg += ` - Fuel ${fuel[key]}kg`;
  sendTelegram(buildTelegramMessage(msg));
}

// Clears every field of the leg in progress. Does not touch history.
function clearLegFields(){
  current = {};
  fuel = {};
  hoistCount = 0;
  document.getElementById('hoistCount').textContent = hoistCount;
  keys.forEach(k=>{
    document.getElementById('disp-'+k).value = '';
    document.getElementById('step-'+k).classList.remove('done');
  });
  document.querySelectorAll('.fuel-input').forEach(input=> input.value = '');
  document.getElementById('routeInput').value = '';
  resetTimers();
}

function resetLeg(){
  clearLegFields();
  setEditing(null);
  applyCarryOver();
  updateSummary();
  updateLiftLandTimer();
  updateStartStopTimer();
  updateFocus();
}

// ---- Editing a saved leg ------------------------------------------------
// editingIndex is the position in history of the leg being edited, or null for
// a normal new leg. Save updates that slot in place instead of appending.
let editingIndex = null;
// A saved leg keeps only the first start, last end and the total for its
// mission timer, not the individual runs, so a multi-run leg cannot be rebuilt
// exactly. The original block is therefore kept verbatim unless the user
// actually touches the mission timer during the edit.
let editingMission = null;
let missionTouched = false;

function setEditing(index){
  editingIndex = index;
  missionTouched = false;
  if (index === null) editingMission = null;
  const editing = index !== null;
  document.getElementById('saveBtn').textContent = editing ? 'Update Leg' : 'Save Leg';
  document.getElementById('resetBtn').textContent = editing ? 'Cancel Edit' : 'Reset Leg';
}

// Is there anything in the leg in progress that the user actually entered? A
// carried start doesn't count - it was filled in automatically.
function hasUnsavedLegData(){
  const carried = document.getElementById('step-off_blocks').classList.contains('carried');
  if (current.airborne || current.landed || current.on_blocks) return true;
  if (current.off_blocks && !carried) return true;
  if (hoistCount > 0) return true;
  if (timers.mission.running || timers.mission.segments.length) return true;
  if (document.getElementById('routeInput').value.trim()) return true;
  return Object.keys(fuel).some(k =>
    !(k === 'off_blocks' && carried) && (fuel[k] || '').trim() !== ''
  );
}

function loadLegForEdit(index){
  const legs = loadHistory();
  const leg = legs[index];
  if (!leg) return;
  clearLegFields();
  setEditing(index);
  editingMission = leg.mission || null;

  keys.forEach(k=>{
    if (!leg[k]) return;
    current[k] = new Date(leg[k]);
    document.getElementById('disp-'+k).value = toHHMM(current[k]);
    document.getElementById('step-'+k).classList.add('done');
  });
  fuel = { ...(leg.fuel || {}) };
  Object.keys(fuel).forEach(k=>{
    const input = document.getElementById('fuel-'+k);
    if (input) input.value = fuel[k];
  });
  hoistCount = leg.hoistCount || 0;
  document.getElementById('hoistCount').textContent = hoistCount;
  document.getElementById('routeInput').value = leg.route || '';
  if (leg.reg) document.getElementById('regInput').value = leg.reg;

  // Shown as a single run purely so the times are visible and editable; the
  // saved block is what gets written back unless missionTouched flips.
  if (leg.mission && leg.mission.periods > 0 && leg.mission.start && leg.mission.end){
    timers.mission.segments = [{ start: new Date(leg.mission.start), end: new Date(leg.mission.end) }];
    timers.mission.running = false;
    timers.mission.currentStart = null;
  }
  renderTimer('mission');

  // Take the carried flag from the leg itself rather than re-deriving it.
  setStartCarried(!!leg.startCarried);

  renderHistory(legs);
  updateSummary();
  updateLiftLandTimer();
  updateStartStopTimer();
  updateFocus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  showToast('Editing leg ' + (index + 1));
}

// A leg that was never shut down means the engine is still running, so the next
// leg has no new engine start of its own. Carry the original Start forward and
// lock it - there is nothing to capture. Fuel is left blank and still editable,
// since that is a fresh reading.
function applyCarryOver(){
  const prev = loadHistory().slice(-1)[0];
  const carry = !!(prev && prev.off_blocks && !prev.on_blocks);
  if (carry){
    current.off_blocks = new Date(prev.off_blocks);
    document.getElementById('disp-off_blocks').value = toHHMM(current.off_blocks);
    document.getElementById('step-off_blocks').classList.add('done');
    // The engine has been running since that start, so its fuel reading still
    // applies to this leg. Carry it across too, and leave it editable.
    const prevStartFuel = prev.fuel && prev.fuel.off_blocks;
    if (prevStartFuel){
      fuel.off_blocks = prevStartFuel;
      document.getElementById('fuel-off_blocks').value = prevStartFuel;
    }
  }
  setStartCarried(carry);
}

// Split out so edit mode can restore a saved leg's carried state directly,
// rather than re-deriving it from whatever is currently last in history.
function setStartCarried(on){
  const step = document.getElementById('step-off_blocks');
  const btn = step.querySelector('button.capture');
  step.classList.toggle('carried', on);
  btn.disabled = on;
  btn.textContent = on ? 'Carried' : 'Capture';
}

// Time spent on the ground between the previous leg landing and this one lifting.
// Only counted when the engine kept running - if the previous leg recorded a
// shutdown, the gap is just time parked, not ground time.
function groundMinutesFor(prevLeg, liftDate){
  if (!prevLeg || !prevLeg.landed || prevLeg.on_blocks || !liftDate) return null;
  const mins = diffMinutes(new Date(prevLeg.landed), liftDate);
  return mins >= 0 ? mins : null;
}

// Every engine-running-but-not-flying span attributable to this leg: the
// carried gap from the previous leg's Land to this leg's Lift (hot-load
// only), this leg's own Start (if not carried - a carried Start is stale,
// not a real taxi-out) to its own first Lift, and this leg's own Land to its
// own Shutdown. Computed live from the current leg list rather than stored,
// so it self-corrects after edits or reordering instead of freezing whatever
// the neighbor was at save time. Flying Time + Ground Time therefore always
// sums to Start-Shutdown (Blades Turning) for a continuous engine run.
function legGroundMinutes(prevLeg, leg){
  let mins = 0, has = false;
  const gap = groundMinutesFor(prevLeg, leg.airborne ? new Date(leg.airborne) : null);
  if (gap !== null){ mins += gap; has = true; }
  if (!leg.startCarried && leg.off_blocks && leg.airborne){
    const taxiOut = diffMinutes(new Date(leg.off_blocks), new Date(leg.airborne));
    if (taxiOut >= 0){ mins += taxiOut; has = true; }
  }
  if (leg.landed && leg.on_blocks){
    const taxiIn = diffMinutes(new Date(leg.landed), new Date(leg.on_blocks));
    if (taxiIn >= 0){ mins += taxiIn; has = true; }
  }
  return has ? mins : null;
}

function snapshotTimer(name){
  const t = timers[name];
  const now = new Date();
  const segments = t.segments.slice();
  if (t.running && t.currentStart) segments.push({ start: t.currentStart, end: now });
  const totalMs = segments.reduce((sum,seg)=> sum + (seg.end - seg.start), 0);
  return {
    start: segments.length ? segments[0].start.toISOString() : null,
    end: segments.length ? segments[segments.length-1].end.toISOString() : null,
    totalMinutes: Math.round(totalMs/60000),
    periods: segments.length
  };
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}
function saveHistory(legs){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(legs));
  }catch(e){ console.error('storage error', e); }
}

function renderHistory(legs){
  const el = document.getElementById('historyList');
  const totalCard = document.getElementById('totalFuelCard');
  if (!legs.length){
    el.innerHTML = '<div class="empty">No legs saved yet</div>';
    totalCard.style.display = 'none';
    return;
  }
  el.innerHTML = legs.map((leg, i)=>{
    const uploadedKg = uploadedBetween(legs[i-1], leg);
    const legGround = legGroundMinutes(legs[i-1], leg);
    // Null rather than a dash when there was no shutdown - the whole row is
    // dropped instead, matching the export.
    const bt = (leg.off_blocks && leg.on_blocks) ? fmtDuration(diffMinutes(new Date(leg.off_blocks), new Date(leg.on_blocks))) : null;
    const liftLandDur = (leg.airborne && leg.landed) ? fmtDuration(diffMinutes(new Date(leg.airborne), new Date(leg.landed))) : null;
    const dateStr = leg.savedAt ? new Date(leg.savedAt).toLocaleDateString('en-GB') : '';
    const mission = leg.mission && leg.mission.periods > 0
      ? `<div class="row2"><span class="times mono">Mission ${fmtTime(new Date(leg.mission.start))} → ${fmtTime(new Date(leg.mission.end))}</span><span class="durations mono">${fmtDuration(leg.mission.totalMinutes)}</span></div>`
      : '';
    const legFuelUsed = fuelUsedFor(leg.fuel);
    const fuelParts = fuelPartsFor(leg.fuel);
    const fuelLine = fuelParts.length
      ? `<div class="row2"><span class="times mono" style="color:var(--text-dim); font-size:11px;">${fuelParts.join(' · ')}</span>${legFuelUsed!==null ? `<span class="durations mono">Used ${legFuelUsed.toFixed(1)}kg</span>` : ''}</div>`
      : '';
    return `<div class="leg-card${editingIndex === i ? ' editing' : ''}" data-index="${i}">
      <div class="row1"><span>${leg.reg || ''}${leg.route ? ' · ' + leg.route : ''}</span><span>${dateStr}</span></div>
      ${leg.hoistCount ? `<div class="row2"><span class="times mono" style="color:var(--text-dim); font-size:11px;">Hoists/Slings: ${leg.hoistCount}</span></div>` : ''}
      <div class="row2">
        <span class="times mono">${leg.startCarried ? '' : `Start ${leg.off_blocks?fmtTime(new Date(leg.off_blocks)):'--:--'}`}</span>
        <span class="times mono">Lift ${leg.airborne?fmtTime(new Date(leg.airborne)):'--:--'}</span>
      </div>
      ${mission}
      <div class="row2">
        <span class="times mono">${leg.on_blocks ? `Shutdown ${fmtTime(new Date(leg.on_blocks))}` : ''}</span>
        <span class="times mono">Land ${leg.landed?fmtTime(new Date(leg.landed)):'--:--'}</span>
      </div>
      ${(bt || liftLandDur) ? `<div class="row2">
        <span class="durations mono">${bt ? `Total ${bt}` : ''}</span>
        <span class="durations mono">${liftLandDur ? `Total ${liftLandDur}` : ''}</span>
      </div>` : ''}
      ${legGround !== null ? `<div class="row2"><span class="times mono" style="color:var(--text-dim); font-size:11px;">Ground Time</span><span class="durations mono">${fmtDuration(legGround)}</span></div>` : ''}
      ${uploadedKg !== null ? `<div class="row2"><span class="times mono" style="color:var(--text-dim); font-size:11px;">Fuel uploaded since previous leg</span><span class="durations mono">+${uploadedKg.toFixed(1)}kg</span></div>` : ''}
      ${fuelLine}
    </div>`;
  }).join('');

  // Totals across every saved leg. Each row is hidden unless at least one leg
  // contributed to it, so the card never shows a bare "0" for something that
  // was simply never recorded.
  let flyingMins = 0, anyFlying = false;
  let turningMins = 0, anyTurning = false;
  let groundMins = 0, anyGround = false;
  let fuelUsed = 0,   anyFuelUsed = false;
  let uploaded = 0,   anyUploaded = false;
  legs.forEach((leg, i)=>{
    if (leg.airborne && leg.landed){
      flyingMins += diffMinutes(new Date(leg.airborne), new Date(leg.landed));
      anyFlying = true;
    }
    if (leg.off_blocks && leg.on_blocks){
      turningMins += diffMinutes(new Date(leg.off_blocks), new Date(leg.on_blocks));
      anyTurning = true;
    }
    const g = legGroundMinutes(legs[i-1], leg);
    if (g !== null){
      groundMins += g;
      anyGround = true;
    }
    const u = fuelUsedFor(leg.fuel);
    if (u !== null){ fuelUsed += u; anyFuelUsed = true; }
    const up = uploadedBetween(legs[i-1], leg);
    if (up !== null){ uploaded += up; anyUploaded = true; }
  });

  const rows = [
    ['rowFlyingTime',    'totalFlyingTime',    anyFlying,   ()=> fmtDuration(flyingMins)],
    ['rowBladesTurning', 'totalBladesTurning', anyTurning,  ()=> fmtDuration(turningMins)],
    ['rowGroundTime',    'totalGroundTime',    anyGround,   ()=> fmtDuration(groundMins)],
    ['rowFuelUsed',     'totalFuelUsed',     anyFuelUsed, ()=> fuelUsed.toFixed(1) + ' kg'],
    ['rowFuelUploaded', 'totalFuelUploaded', anyUploaded, ()=> uploaded.toFixed(1) + ' kg']
  ];
  rows.forEach(([rowId, valId, has, fmt])=>{
    document.getElementById(rowId).style.display = has ? '' : 'none';
    if (has) document.getElementById(valId).textContent = fmt();
  });
  totalCard.style.display = rows.some(r => r[2]) ? 'block' : 'none';
}

document.querySelectorAll('button.capture').forEach(btn=>{
  btn.addEventListener('click', ()=> capture(btn.dataset.key));
});

document.querySelectorAll('.fuel-input').forEach(input=>{
  input.addEventListener('input', ()=>{
    fuel[input.dataset.fuel] = input.value;
    updateSummary();
    updateFuelVisibility();
  });
});

document.querySelectorAll('input.time-display').forEach(input=>{
  input.addEventListener('change', ()=>{
    const key = input.dataset.key;
    if (!input.value){
      // A carried start belongs to the previous leg, not to anything typed
      // here, and its Capture button is disabled - so clearing it (easily done
      // by opening the iOS time picker and dismissing it) would strand the leg
      // with no start and no way to re-capture one. Put it back instead.
      if (key === 'off_blocks' && document.getElementById('step-off_blocks').classList.contains('carried')){
        applyCarryOver();
      } else {
        delete current[key];
        document.getElementById('step-'+key).classList.remove('done');
      }
    } else {
      const [hh, mm] = input.value.split(':').map(Number);
      const base = current[key] instanceof Date ? new Date(current[key]) : new Date();
      base.setHours(hh, mm, 0, 0);
      current[key] = base;
      document.getElementById('step-'+key).classList.add('done');
    }
    updateSummary();
    updateLiftLandTimer();
    updateStartStopTimer();
    updateFocus();
  });
});

document.getElementById('start-mission').addEventListener('click', ()=> startTimer('mission'));
document.getElementById('end-mission').addEventListener('click', ()=> endTimer('mission'));

document.getElementById('mission-start-time').addEventListener('change', (e)=>{
  if (!e.target.value) return;
  const [hh, mm] = e.target.value.split(':').map(Number);
  const t = timers.mission;
  const refDate = t.currentStart || (t.segments[0] && t.segments[0].start) || new Date();
  const d = new Date(refDate);
  d.setHours(hh, mm, 0, 0);
  setMissionStart(d);
});

document.getElementById('mission-end-time').addEventListener('change', (e)=>{
  if (!e.target.value) return;
  const [hh, mm] = e.target.value.split(':').map(Number);
  const t = timers.mission;
  const refDate = (t.segments.length && t.segments[t.segments.length-1].end) || new Date();
  const d = new Date(refDate);
  d.setHours(hh, mm, 0, 0);
  setMissionEnd(d);
});

document.getElementById('hoistMinus').addEventListener('click', ()=>{
  if (hoistCount > 0) hoistCount--;
  document.getElementById('hoistCount').textContent = hoistCount;
});
document.getElementById('hoistPlus').addEventListener('click', ()=>{
  hoistCount++;
  document.getElementById('hoistCount').textContent = hoistCount;
});

document.getElementById('resetBtn').addEventListener('click', resetLeg);

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const missionData = snapshotTimer('mission');
  const hasFlightData = current.off_blocks || current.on_blocks || current.airborne || current.landed;
  const hasTimerData = missionData.periods > 0;
  if (!hasFlightData && !hasTimerData){
    showToast('Nothing captured yet');
    return;
  }
  const legs = loadHistory();
  const isEdit = editingIndex !== null && legs[editingIndex];
  const record = {
    reg: document.getElementById('regInput').value,
    route: document.getElementById('routeInput').value,
    hoistCount: hoistCount,
    // Not captured on this leg - the engine kept running from the previous
    // one. Recorded so history/export can skip showing a Start time this leg
    // never actually had, same as the live block hides it.
    startCarried: document.getElementById('step-off_blocks').classList.contains('carried'),
    off_blocks: current.off_blocks ? current.off_blocks.toISOString() : null,
    airborne: current.airborne ? current.airborne.toISOString() : null,
    landed: current.landed ? current.landed.toISOString() : null,
    on_blocks: current.on_blocks ? current.on_blocks.toISOString() : null,
    // Keep the saved mission block verbatim unless the timer was actually
    // touched - a multi-run leg can't be rebuilt from what a leg stores, so
    // re-snapshotting an untouched one would flatten it and inflate the total.
    mission: (isEdit && !missionTouched && editingMission) ? editingMission : missionData,
    fuel: { ...fuel },
    // An edited leg keeps its original date rather than jumping to today.
    savedAt: isEdit ? (legs[editingIndex].savedAt || new Date().toISOString()) : new Date().toISOString()
  };
  if (isEdit) legs[editingIndex] = record; else legs.push(record);
  saveHistory(legs);
  renderHistory(legs);
  showToast(isEdit ? 'Leg updated' : 'Leg saved');
  resetLeg();
});

function legToText(leg, prevLeg){
  const lines = [];
  lines.push(`Reg: ${leg.reg || ''}`);
  if (leg.route) lines.push(`Route: ${leg.route}`);
  if (leg.hoistCount) lines.push(`Hoists/Slings: ${leg.hoistCount}`);
  lines.push(`Date: ${leg.savedAt ? new Date(leg.savedAt).toLocaleDateString('en-GB') : ''}`);
  if (!leg.startCarried) lines.push(`Start: ${leg.off_blocks ? fmtTime(new Date(leg.off_blocks)) : '--:--'}`);
  lines.push(`Lift: ${leg.airborne ? fmtTime(new Date(leg.airborne)) : '--:--'}`);
  if (leg.mission && leg.mission.periods > 0){
    lines.push(`Mission: ${fmtTime(new Date(leg.mission.start))} -> ${fmtTime(new Date(leg.mission.end))} (${fmtDuration(leg.mission.totalMinutes)})`);
  }
  lines.push(`Land: ${leg.landed ? fmtTime(new Date(leg.landed)) : '--:--'}`);
  if (leg.on_blocks) lines.push(`Shutdown: ${fmtTime(new Date(leg.on_blocks))}`);
  const bt = (leg.off_blocks && leg.on_blocks) ? fmtDuration(diffMinutes(new Date(leg.off_blocks), new Date(leg.on_blocks))) : null;
  if (bt) lines.push(`Start-Shutdown: ${bt}`);
  const liftLandDur = (leg.airborne && leg.landed) ? fmtDuration(diffMinutes(new Date(leg.airborne), new Date(leg.landed))) : null;
  if (liftLandDur) lines.push(`Lift-Land: ${liftLandDur}`);
  const legGround = legGroundMinutes(prevLeg, leg);
  if (legGround !== null) lines.push(`Ground Time: ${fmtDuration(legGround)}`);
  const uploadedKg = uploadedBetween(prevLeg, leg);
  if (uploadedKg !== null) lines.push(`Fuel uploaded since previous leg: ${uploadedKg.toFixed(1)}kg`);
  if (leg.fuel){
    const fuelParts = fuelPartsFor(leg.fuel);
    if (fuelParts.length) lines.push(`Fuel: ${fuelParts.join(', ')}`);
    const used = fuelUsedFor(leg.fuel);
    if (used !== null) lines.push(`Fuel Used: ${used.toFixed(1)}kg`);
  }
  return lines.join('\n');
}

async function exportHistory(){
  const legs = loadHistory();
  if (!legs.length){
    showToast('No legs to export');
    return;
  }
  const text = legs.map((leg, i)=> legToText(leg, legs[i-1])).join('\n\n' + '-'.repeat(30) + '\n\n');
  const filename = 'flight-legs-' + new Date().toISOString().slice(0,10) + '.txt';
  const blob = new Blob([text], { type: 'text/plain' });

  try {
    const file = new File([blob], filename, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Flight Legs Export' });
      showToast('Export shared');
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError') return;
  }

  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(()=> URL.revokeObjectURL(url), 60000);
  showToast('Export started');
}

document.getElementById('exportHistory').addEventListener('click', exportHistory);

// window.confirm renders as OK/Cancel on iOS with no way to relabel it, so a
// Yes/No question uses this small in-app sheet instead.
function askYesNo(message){
  return new Promise((resolve)=>{
    const overlay = document.getElementById('confirmOverlay');
    document.getElementById('confirmMessage').textContent = message;
    overlay.classList.add('show');
    function done(answer){
      overlay.classList.remove('show');
      yesBtn.removeEventListener('click', onYes);
      noBtn.removeEventListener('click', onNo);
      resolve(answer);
    }
    const yesBtn = document.getElementById('confirmYes');
    const noBtn = document.getElementById('confirmNo');
    function onYes(){ done(true); }
    function onNo(){ done(false); }
    yesBtn.addEventListener('click', onYes);
    noBtn.addEventListener('click', onNo);
  });
}

// Tap a saved leg to pull it back into the fields above and correct it.
document.getElementById('historyList').addEventListener('click', async (e)=>{
  const card = e.target.closest('.leg-card');
  if (!card) return;
  const index = Number(card.dataset.index);
  if (!Number.isInteger(index)) return;
  let message = 'Edit this leg?';
  if (editingIndex === index) message = 'Reload this leg? Unsaved changes to it will be lost.';
  else if (editingIndex !== null) message = 'Switch to this leg? Unsaved changes will be lost.';
  else if (hasUnsavedLegData()) message = 'Edit this leg? The leg in progress will be discarded.';
  if (await askYesNo(message)) loadLegForEdit(index);
});

document.getElementById('clearHistory').addEventListener('click', async ()=>{
  saveHistory([]);
  renderHistory([]);
  // Indices are meaningless once history is gone.
  setEditing(null);
  // History is what carry-over reads from, so a carried start would be left
  // pointing at a leg that no longer exists - ask before wiping the one in
  // progress rather than silently taking it along.
  if (await askYesNo('Also reset the leg in progress?')){
    resetLeg();
  } else {
    // resetLeg() already refreshes these, but if the leg is being kept, the
    // totals still need to drop back to reflect the now-empty history.
    updateLiftLandTimer();
    updateStartStopTimer();
  }
  showToast('History cleared');
});

document.getElementById('regInput').addEventListener('change', (e)=>{
  try{ localStorage.setItem(REG_KEY, e.target.value); }catch(err){}
});

(function init(){
  try{
    const reg = localStorage.getItem(REG_KEY);
    if (reg) document.getElementById('regInput').value = reg;
    const workerUrl = localStorage.getItem(WORKER_URL_KEY);
    if (workerUrl) document.getElementById('workerUrl').value = workerUrl;
  }catch(e){}
  const legs = loadHistory();
  renderHistory(legs);
  applyCarryOver();
  updateSummary();
  updateFocus();
  renderTimer('mission');
  tickTimers();
})();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    // updateViaCache:'none' stops the browser serving sw.js itself from its
    // HTTP cache, which is what lets a stale worker survive a version bump.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then((reg) => {
        reg.update();
        // A Home Screen app is resumed rather than reloaded, so it can sit on
        // an old worker indefinitely. Check again every time it comes forward.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      })
      .catch(()=>{});
  });
}

(function(){
  const bar = document.getElementById('doneBar');
  const btn = document.getElementById('doneBarBtn');

  function positionBar(){
    if (window.visualViewport){
      const vv = window.visualViewport;
      const inset = window.innerHeight - (vv.height + vv.offsetTop);
      bar.style.transform = inset > 0 ? `translateY(-${inset}px)` : 'translateY(0)';
    }
  }
  function showBar(){
    bar.style.display = 'flex';
    positionBar();
  }
  function hideBar(){
    bar.style.display = 'none';
  }

  document.querySelectorAll('input.fuel-input, input.reg, input.route').forEach(inp=>{
    inp.addEventListener('focus', showBar);
    inp.addEventListener('blur', ()=>{
      setTimeout(()=>{
        const active = document.activeElement;
        if (!active || active.tagName !== 'INPUT') hideBar();
      }, 60);
    });
  });

  document.querySelectorAll('input.fuel-input').forEach(inp=>{
    inp.addEventListener('focus', ()=>{
      const len = inp.value.length;
      setTimeout(()=> inp.setSelectionRange(len, len), 0);
    });
  });

  btn.addEventListener('click', ()=>{
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    hideBar();
  });

  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', positionBar);
    window.visualViewport.addEventListener('scroll', positionBar);
  }
})();
</script>
